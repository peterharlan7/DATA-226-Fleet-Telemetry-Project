<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 976" width="1600" height="976" font-family="Helvetica, Arial, sans-serif">
  <title>Fleet telemetry pipeline: flow schematic (B29)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .tb { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .s  { font-size: 12.5px; fill: #334155; }
      .m  { font-size: 11.5px; fill: #475569; font-family: Menlo, Consolas, monospace; }
      .h  { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .ln { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .lg { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrG); }
      .lab { font-size: 11.5px; fill: #475569; font-style: italic; }
      .inner { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="976" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="40" font-size="24" font-weight="700" fill="#0f172a">Real-Time Fleet Telemetry Pipeline: data flow</text>
  <text x="30" y="64" class="s">Live GTFS-realtime feeds → Kafka → Spark Structured Streaming → Parquet + MongoDB, scored offline against exact ground truth.</text>

  <!-- Column headers (one per column, all at y=116) -->
  <text x="30"   y="116" class="h">1 · SOURCES</text>
  <text x="270"  y="116" class="h">2 · INGESTION</text>
  <text x="560"  y="116" class="h">3 · MESSAGE BUS</text>
  <text x="790"  y="116" class="h">4 · STREAM PROCESSING</text>
  <text x="1140" y="116" class="h">5 · STORAGE</text>
  <text x="1390" y="116" class="h">6 · SERVING</text>

  <!-- Row grid used by every column: R1 180-260 (c220) · R2 272-352 (c312) · R3 364-444 (c404) · R4 456-536 (c496) -->

  <!-- ============ 1. SOURCES ============ -->
  <rect x="30" y="180" width="200" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="44" y="202" class="t">511.org GTFS-rt</text>
  <text x="44" y="221" class="s">Vehicle positions per agency</text>
  <text x="44" y="238" class="m">SF Muni · SC VTA · AC …</text>
  <text x="44" y="253" class="m">protobuf, 60 req/h/key</text>

  <rect x="30" y="272" width="200" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="44" y="294" class="t">BART GTFS-rt</text>
  <text x="44" y="313" class="s">Trip updates: predicted</text>
  <text x="44" y="329" class="s">delay per station</text>
  <text x="44" y="345" class="m">no vehicle positions</text>

  <rect x="30" y="456" width="200" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="478" class="t">Replay inputs</text>
  <text x="44" y="497" class="s">Argoverse 2 AV tracks,</text>
  <text x="44" y="513" class="s">recorded live stream</text>
  <text x="44" y="529" class="m">prepare_av2.py</text>

  <!-- ============ 2. INGESTION ============ -->
  <rect x="270" y="180" width="250" height="172" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="284" y="202" class="t">Python producers</text>
  <text x="284" y="219" class="m">producer_all.py · _bart.py</text>
  <g class="s">
    <rect x="284" y="228" width="222" height="22" rx="5" class="inner" stroke="#c4b5fd"/>
    <text x="294" y="244">① Poll + decode protobuf</text>
    <rect x="284" y="252" width="222" height="22" rx="5" class="inner" stroke="#c4b5fd"/>
    <text x="294" y="268">② Hash vehicle_id (HMAC, B13)</text>
    <rect x="284" y="276" width="222" height="22" rx="5" class="inner" stroke="#c4b5fd"/>
    <text x="294" y="292">③ Map to common schema (B4)</text>
    <rect x="284" y="300" width="222" height="22" rx="5" class="inner" stroke="#c4b5fd"/>
    <text x="294" y="316">④ validate(), drop bad rows</text>
    <rect x="284" y="324" width="222" height="22" rx="5" class="inner" stroke="#c4b5fd"/>
    <text x="294" y="340">⑤ Publish, key = vehicle_id</text>
  </g>

  <rect x="270" y="456" width="250" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="284" y="478" class="t">Replay producer</text>
  <text x="284" y="495" class="m">av_replay.py</text>
  <text x="284" y="513" class="s">speed-up, virtual vehicles,</text>
  <text x="284" y="529" class="s">injected duplicate / late events</text>

  <!-- ============ 3. KAFKA ============ -->
  <rect x="560" y="130" width="190" height="422" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="574" y="152" class="t">Apache Kafka 3.8</text>
  <text x="574" y="169" class="m">KRaft · 3 partitions</text>

  <rect x="574" y="200" width="162" height="40" rx="20" fill="#ffffff" stroke="#f59e0b"/>
  <text x="655" y="224" class="m" text-anchor="middle" fill="#92400e">vehicle-positions</text>
  <rect x="574" y="292" width="162" height="40" rx="20" fill="#ffffff" stroke="#f59e0b"/>
  <text x="655" y="316" class="m" text-anchor="middle" fill="#92400e">trip-updates</text>
  <text x="655" y="374" class="lab" text-anchor="middle">no streaming job yet:</text>
  <text x="655" y="390" class="lab" text-anchor="middle">recorded and analysed</text>
  <text x="655" y="406" class="lab" text-anchor="middle">offline (B15)</text>
  <rect x="574" y="476" width="162" height="40" rx="20" fill="#ffffff" stroke="#f59e0b" stroke-dasharray="5 3"/>
  <text x="655" y="494" class="m" text-anchor="middle" fill="#92400e">replay-* / bench-*</text>
  <text x="655" y="508" class="m" text-anchor="middle" fill="#92400e" font-size="10">header origin=replay</text>

  <!-- ============ 4. SPARK ============ -->
  <rect x="790" y="130" width="320" height="422" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="804" y="152" class="t">Spark 3.5 Structured Streaming</text>
  <text x="804" y="169" class="m">event-time windows · checkpoints</text>

  <rect x="804" y="180" width="292" height="80" rx="8" class="inner" stroke="#86efac"/>
  <text x="816" y="200" class="tb">Archive job (B7)</text>
  <text x="816" y="217" class="m">stream_to_parquet.py --mongo</text>
  <text x="816" y="235" class="s">every event → Parquet archive;</text>
  <text x="816" y="251" class="s">newest position per vehicle → MongoDB</text>

  <rect x="804" y="272" width="292" height="80" rx="8" class="inner" stroke="#86efac"/>
  <text x="816" y="292" class="tb">Bus-bunching detector (B12)</text>
  <text x="816" y="309" class="m">detect_bunching.py</text>
  <text x="816" y="327" class="s">same route + direction, &lt; 200 m apart;</text>
  <text x="816" y="343" class="s">60 s window, 5 min look-back, 30 s wm</text>

  <rect x="804" y="364" width="292" height="80" rx="8" class="inner" stroke="#86efac"/>
  <text x="816" y="384" class="tb">Stalled-vehicle detector (B16)</text>
  <text x="816" y="401" class="m">detect_stalled.py</text>
  <text x="816" y="419" class="s">in service, within 50 m for ≥ 10 min,</text>
  <text x="816" y="435" class="s">not STOPPED_AT, ≥ 3 reports</text>

  <rect x="804" y="456" width="292" height="80" rx="8" class="inner" stroke="#86efac"/>
  <text x="816" y="476" class="tb">Streaming algorithms (B17, B23)</text>
  <text x="816" y="493" class="m">stream_algorithms.py</text>
  <text x="816" y="511" class="s">Bloom-filter dedup · reservoir sample ·</text>
  <text x="816" y="527" class="s">Flajolet-Martin distinct vehicles</text>

  <!-- ============ 5. STORAGE ============ -->
  <rect x="1140" y="130" width="220" height="422" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1154" y="152" class="t">Storage</text>
  <text x="1154" y="169" class="m">history + current state</text>

  <!-- cylinders: top ellipse ry 9, body to y+71 -->
  <g stroke-width="1.5">
    <path d="M1152,189 a98,9 0 0,1 196,0 v62 a98,9 0 0,1 -196,0 z" fill="#ffffff" stroke="#475569"/>
    <path d="M1152,189 a98,9 0 0,0 196,0" fill="none" stroke="#475569"/>
    <path d="M1152,281 a98,9 0 0,1 196,0 v62 a98,9 0 0,1 -196,0 z" fill="#dcfce7" stroke="#15803d"/>
    <path d="M1152,281 a98,9 0 0,0 196,0" fill="none" stroke="#15803d"/>
    <path d="M1152,373 a98,9 0 0,1 196,0 v62 a98,9 0 0,1 -196,0 z" fill="#ffffff" stroke="#475569"/>
    <path d="M1152,373 a98,9 0 0,0 196,0" fill="none" stroke="#475569"/>
  </g>
  <text x="1250" y="221" class="tb" text-anchor="middle">Parquet archive</text>
  <text x="1250" y="238" class="m" text-anchor="middle">data/raw/vehicle_events</text>
  <text x="1250" y="253" class="s" text-anchor="middle" font-size="11.5">full history for scans</text>

  <text x="1250" y="313" class="tb" text-anchor="middle">MongoDB 7 (B11)</text>
  <text x="1250" y="330" class="m" text-anchor="middle">latest_positions</text>
  <text x="1250" y="345" class="m" text-anchor="middle">alerts (idempotent _id)</text>

  <text x="1250" y="405" class="tb" text-anchor="middle">Parquet alerts</text>
  <text x="1250" y="422" class="m" text-anchor="middle">data/alerts/</text>
  <text x="1250" y="437" class="m" text-anchor="middle">bunching · stalled</text>

  <rect x="1152" y="460" width="196" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1250" y="488" class="tb" text-anchor="middle">JSON / CSV reports</text>
  <text x="1250" y="506" class="m" text-anchor="middle">benchmarks/results/</text>

  <!-- ============ 6. SERVING ============ -->
  <rect x="1390" y="180" width="180" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1402" y="202" class="t">Live dashboard</text>
  <text x="1402" y="219" class="m">viz_web.py :8000</text>
  <text x="1402" y="236" class="s">map + timeline, 2 s</text>
  <text x="1402" y="252" class="s">reads Kafka directly</text>

  <rect x="1390" y="272" width="180" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1402" y="294" class="t">Ops queries</text>
  <text x="1402" y="311" class="m">mongo_sink.py</text>
  <text x="1402" y="328" class="s">where vehicles are now,</text>
  <text x="1402" y="344" class="s">recent alerts by route</text>

  <rect x="1390" y="456" width="180" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1402" y="478" class="t">Report + slides</text>
  <text x="1402" y="497" class="s">figures and tables</text>
  <text x="1402" y="513" class="s">from benchmark and</text>
  <text x="1402" y="529" class="s">analysis results</text>

  <!-- ============ LIVE ARROWS (straight, row-aligned) ============ -->
  <!-- sources -> ingestion -->
  <path class="ln" d="M230,220 H270"/>
  <path class="ln" d="M230,312 H270"/>
  <path class="lg" d="M230,496 H270"/>
  <!-- ingestion -> kafka -->
  <path class="ln" d="M520,220 H574"/>
  <path class="ln" d="M520,312 H574"/>
  <path class="lg" d="M520,496 H574"/>
  <!-- kafka -> spark: vehicle-positions fans out to all four jobs -->
  <path class="ln" d="M736,220 H804"/>
  <path d="M770,220 V496" stroke="#334155" stroke-width="2" fill="none"/>
  <path class="ln" d="M770,312 H804"/>
  <path class="ln" d="M770,404 H804"/>
  <path class="ln" d="M770,496 H804"/>
  <circle cx="770" cy="220" r="3.5" fill="#334155"/>
  <!-- replay topics are read by the same jobs (topic flag) -->
  <path d="M736,496 H770" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/>
  <text x="655" y="532" class="lab" text-anchor="middle" font-size="10.5">same jobs, --topic</text>
  <!-- spark -> storage -->
  <path class="ln" d="M1096,220 H1152"/>
  <path class="ln" d="M1096,248 H1124 V300 H1152"/>
  <path class="ln" d="M1096,320 H1152"/>
  <path class="ln" d="M1096,340 H1118 V390 H1152"/>
  <path class="ln" d="M1096,412 H1152"/>
  <path class="ln" d="M1096,496 H1152"/>
  <!-- storage -> serving -->
  <path class="ln" d="M1348,312 H1390"/>
  <path class="ln" d="M1348,496 H1390"/>
  <!-- kafka -> dashboard, over the top -->
  <path class="ln" d="M728,200 V88 H1530 V180"/>
  <text x="1130" y="82" class="lab" text-anchor="middle">live position stream → dashboard</text>

  <!-- ============ OFFLINE BAND ============ -->
  <rect x="20" y="592" width="1560" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="40" y="618" class="h">7 · OFFLINE: TESTING AND EVALUATION</text>

  <!-- row 1: y 636-736 -->
  <rect x="30" y="636" width="490" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="44" y="658" class="t">Test feeds (no live data needed)</text>
  <text x="44" y="678" class="m">simulator_producer.py</text>
  <text x="214" y="678" class="s">→ vehicle-positions, source SIM</text>
  <text x="44" y="698" class="m">fake_feed.py</text>
  <text x="214" y="698" class="s">→ file folder → Spark, planted events</text>
  <text x="44" y="718" class="m">evaluate_*.py</text>
  <text x="214" y="718" class="s">→ recall on planted bunching / stalls</text>

  <rect x="560" y="636" width="190" height="100" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="574" y="658" class="t">Record</text>
  <text x="574" y="675" class="m">record_stream.py</text>
  <text x="574" y="694" class="s">both live topics →</text>
  <text x="574" y="710" class="s">JSON lines (24 h)</text>
  <text x="574" y="727" class="m" font-size="10.5">recording_24h.jsonl</text>

  <rect x="790" y="636" width="320" height="100" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="804" y="658" class="t">Replay into the detectors</text>
  <text x="804" y="675" class="m">replay_recording.py</text>
  <text x="804" y="694" class="s">original timestamps, one file per</text>
  <text x="804" y="710" class="s">micro-batch, so windows close in order</text>

  <rect x="1150" y="636" width="180" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1162" y="658" class="t">Ground truth (B18)</text>
  <text x="1162" y="675" class="m">ground_truth.py</text>
  <text x="1162" y="694" class="s">whole archive, same</text>
  <text x="1162" y="710" class="s">rules, no watermark,</text>
  <text x="1162" y="726" class="s">so nothing is late</text>

  <rect x="1390" y="636" width="180" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1402" y="658" class="t">Score the stream</text>
  <text x="1402" y="675" class="m" font-size="10.5">compare_ground_truth.py</text>
  <text x="1402" y="694" class="s">precision + recall</text>
  <text x="1402" y="710" class="s">per detector, and why</text>
  <text x="1402" y="726" class="s">each alert was missed</text>

  <!-- row 2: y 768-918 -->
  <rect x="30" y="768" width="720" height="134" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="44" y="790" class="t">Benchmarks</text>
  <text x="736" y="790" class="lab" text-anchor="end">each run: its own Kafka topic + the real Spark job</text>
  <g>
    <text x="44"  y="818" class="tb">B22 Throughput + latency</text>
    <text x="44"  y="836" class="m">bench_pipeline.py</text>
    <text x="44"  y="852" class="m">load_generator.py</text>
    <text x="44"  y="872" class="s">rate × trigger interval →</text>
    <text x="44"  y="888" class="s">end-to-end + queue latency</text>

    <text x="282" y="818" class="tb">B24 Fault injection</text>
    <text x="282" y="836" class="m">fault_injection.py</text>
    <text x="282" y="852" class="m">kill_kafka.sh · kill_spark.sh</text>
    <text x="282" y="872" class="s">SIGKILL Kafka or Spark →</text>
    <text x="282" y="888" class="s">events lost or duplicated?</text>

    <text x="520" y="818" class="tb">B25 Design comparison</text>
    <text x="520" y="836" class="m">design_comparison.py</text>
    <text x="520" y="872" class="s">window 1 / 5 / 10 min ×</text>
    <text x="520" y="888" class="s">at-least- vs exactly-once</text>
  </g>
  <line x1="268" y1="806" x2="268" y2="888" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="506" y1="806" x2="506" y2="888" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="790" y="768" width="780" height="134" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="804" y="790" class="t">Analyses</text>
  <text x="1556" y="790" class="lab" text-anchor="end">on the 24 h recording and the archive</text>
  <g>
    <text x="804"  y="818" class="tb">B15 Delay propagation (BART)</text>
    <text x="804"  y="836" class="m">analyze_delay_propagation.py</text>
    <text x="1184" y="818" class="tb">B21 Similar trajectories (MinHash LSH)</text>
    <text x="1184" y="836" class="m">algorithms/lsh_trajectories.py</text>
    <text x="804"  y="872" class="tb">B26 Privacy: k-anonymity, Laplace DP</text>
    <text x="804"  y="890" class="m">algorithms/privacy.py</text>
    <text x="1184" y="872" class="tb">B27 Fairness across routes</text>
    <text x="1184" y="890" class="m">analyze_fairness.py</text>
  </g>
  <line x1="1170" y1="806" x2="1170" y2="888" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ============ OFFLINE ARROWS (short, vertical or horizontal) ============ -->
  <path class="lg" d="M655,552 V636"/>
  <text x="663" y="576" class="lab">record both live topics</text>
  <path class="lg" d="M750,686 H790"/>
  <path class="lg" d="M950,636 V552"/>
  <text x="958" y="576" class="lab">replay as file stream</text>
  <path class="lg" d="M1240,552 V636"/>
  <text x="1232" y="576" class="lab" text-anchor="end">archive</text>
  <path class="lg" d="M1350,552 V660 H1390"/>
  <text x="1358" y="576" class="lab">alerts</text>
  <path class="lg" d="M1330,710 H1390"/>
  <path class="lg" d="M655,736 V752 H840 V768"/>

  <!-- Legend -->
  <g transform="translate(40,952)">
    <line x1="0" y1="0" x2="34" y2="0" class="ln"/>
    <text x="42" y="4" class="s">live path</text>
    <line x1="130" y1="0" x2="164" y2="0" class="lg"/>
    <text x="172" y="4" class="s">replay / test / evaluation path</text>
  </g>
</svg>
